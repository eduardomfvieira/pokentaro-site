<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Caixa | Pokentaro Ipanema</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Painel do caixa: barra fixa no topo, fila de pedidos em colunas (mais antigo à esquerda), concluídos numa gaveta abaixo. */
:root{
  --ve:#01372a; --v:#007d51; --cr:#fff2c3; --la:#ff7701; --ci:#00c4d8; --az:#004366;
  --bg:#f3f1e7; --card:#ffffff; --ink:#10261f; --muted:#5f6f68; --line:#e2e4da;
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--la);outline-offset:2px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;padding:14px 24px;background:var(--ve);color:var(--cr)}
header .logo{height:30px;width:auto;display:block}
header h1{margin:0;font-size:1.05rem;font-weight:600;color:var(--cr);opacity:.9}
header .sp{flex:1}
.stat{display:flex;align-items:baseline;gap:6px;font-size:.85rem;color:#b9d2c8}
.stat b{font-size:1.4rem;color:var(--la);font-variant-numeric:tabular-nums}
.clock{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.conn{display:flex;align-items:center;gap:6px;font-size:.78rem;color:#b9d2c8}
.conn i{width:10px;height:10px;border-radius:50%;background:#7aa597}
.conn.ok i{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
.conn.bad i{background:#f87171}
.sound{border:1px solid rgba(255,242,195,.35);background:transparent;color:var(--cr);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600}
.sound.on{background:var(--cr);color:var(--ve);border-color:var(--cr)}
.banner{margin:16px 24px 0;padding:12px 16px;border-radius:12px;background:#fff3e6;color:#7a3a00;font-size:.9rem;display:flex;justify-content:space-between;align-items:center;gap:12px}
.banner button{border:0;border-radius:8px;background:var(--la);color:#fff;font-weight:600;padding:8px 14px}
.banner.err{background:#ffe4e4;color:#8a1c1c}
main{padding:20px 24px 40px}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:1.2rem;color:var(--ink);margin-bottom:4px}
.order{background:var(--card);border-radius:16px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(1,55,42,.06);display:flex;flex-direction:column;overflow:hidden;border-top:6px solid var(--v)}
.order.fresh{animation:fresh 1s ease-in-out 4;border-top-color:var(--la)}
@keyframes fresh{50%{box-shadow:0 0 0 6px rgba(255,119,1,.35)}}
@media (prefers-reduced-motion:reduce){.order.fresh{animation:none}}
.order.late{border-top-color:#e35d3a}
.oh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.num{font-size:2.6rem;font-weight:800;line-height:1;color:var(--ve);font-variant-numeric:tabular-nums}
.num small{display:block;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.when{text-align:right;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.when b{display:block;font-size:.95rem;color:var(--ink)}
.order.late .when b{color:#c2410c}
.items{list-style:none;margin:0;padding:4px 16px 8px;border-top:1px dashed var(--line)}
.items li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px solid #f0f1ea}
.items li:last-child{border-bottom:0}
.q{font-weight:800;color:var(--la);font-variant-numeric:tabular-nums}
.n{font-weight:600;font-size:.95rem;min-width:0}
.d{grid-column:2/4;font-size:.8rem;color:var(--muted);line-height:1.35}
.p{font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{display:flex;justify-content:space-between;padding:12px 16px;background:#f7f6ef;font-weight:700;font-variant-numeric:tabular-nums}
.tot span:last-child{font-size:1.15rem}
.acts{display:flex;gap:8px;padding:12px 16px 16px}
.done{flex:1;border:0;border-radius:12px;background:var(--v);color:#fff;font-weight:700;padding:13px}
.cancel{border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--muted);font-weight:600;padding:13px 14px}
details.hist{margin-top:28px;background:var(--card);border-radius:16px;box-shadow:0 1px 0 var(--line)}
details.hist summary{cursor:pointer;padding:16px 20px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary span{color:var(--muted);font-weight:500}
.hrow{display:grid;grid-template-columns:70px 70px 1fr 110px 120px;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid #f0f1ea;font-size:.88rem}
.hrow .hn{font-weight:800;color:var(--ve);font-variant-numeric:tabular-nums}
.hrow .ht{color:var(--muted);font-variant-numeric:tabular-nums}
.hrow .hi{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.hrow .hv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hrow .hs{justify-self:end;font-size:.75rem;font-weight:600;border-radius:999px;padding:3px 10px;background:#e3f3ec;color:var(--v)}
.hrow .hs.c{background:#f1f1ee;color:#8a8f8c;text-decoration:line-through}
.hrow button{border:0;background:transparent;color:var(--az);font-weight:600;font-size:.8rem;text-decoration:underline;padding:0;margin-left:8px}
@media (max-width:700px){header{flex-wrap:wrap;gap:10px 14px}.hrow{grid-template-columns:50px 1fr 90px}.hrow .ht,.hrow .hi{display:none}}
</style>
</head>
<body>

  <h1>Pedidos do totem · Ipanema</h1>
  <div class="sp"></div>
  <div class="stat">Na fila <b id="cntQ">0</b></div>
  <div class="stat">Hoje <b id="cntD">0</b></div>
  <div class="conn" id="conn"><i></i><span>Conectando…</span></div>
  <button type="button" class="sound" id="sound">Som desligado</button>
  <div class="clock" id="clock">--:--</div>
</header>
<div class="banner" id="soundBanner"><span>Clique em <b>Ativar som</b> para ouvir um aviso a cada pedido novo.</span><button type="button" id="soundGo">Ativar som</button></div>
<div class="banner err" id="errBanner" hidden></div>
<main>
  <section class="queue" id="queue" aria-live="polite">
    <div class="empty"><b>Nenhum pedido na fila</b>Os pedidos feitos no totem aparecem aqui na hora.</div>
  </section>
  <details class="hist" id="hist">
    <summary>Concluídos e cancelados hoje <span id="histSum">0 pedidos · R$ 0,00</span></summary>
    <div id="histList"></div>
  </details>
</main>
<script>
const $=s=>document.querySelector(s);
const brl=n=>"R$ "+Number(n||0).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm=t=>new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"});
const LATE_MIN=10;

/* ---------- som ---------- */
let ctx=null, soundOn=false;
try{soundOn=localStorage.getItem("pk-caixa-som")==="1"}catch(e){}
function setSound(on){
  soundOn=on; try{localStorage.setItem("pk-caixa-som",on?"1":"0")}catch(e){}
  if(on && !ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} }
  if(ctx && ctx.state==="suspended") ctx.resume();
  $("#sound").classList.toggle("on",on); $("#sound").textContent=on?"Som ligado":"Som desligado";
  $("#soundBanner").hidden=on && !!ctx && ctx.state==="running";
}
function ding(){
  if(!soundOn||!ctx) return;
  const t=ctx.currentTime;
  [[880,0],[1175,.18],[1568,.36]].forEach(([f,d])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.35,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.5);
    o.connect(g).connect(ctx.destination);o.start(t+d);o.stop(t+d+.55);
  });
}
$("#sound").onclick=()=>setSound(!soundOn||!ctx||ctx.state!=="running");
$("#soundGo").onclick=()=>{setSound(true);ding();};
if(soundOn){$("#sound").classList.add("on");$("#sound").textContent="Som ligado";}

/* ---------- dados ---------- */
let PED=[], seen=null, fresh=new Set(), busy=false;
async function load(){
  if(busy) return; busy=true;
  try{
    const r=await fetch("/api/pedidos",{cache:"no-store"});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.erro||("Erro "+r.status));
    PED=j.pedidos||[];
    const ids=new Set(PED.map(p=>p.numero));
    if(seen){ let novo=false; PED.forEach(p=>{ if(!seen.has(p.numero)&&p.status==="novo"){const n=p.numero;fresh.add(n);novo=true;setTimeout(()=>{fresh.delete(n);render();},60000);} }); if(novo) ding(); }
    seen=ids;
    $("#conn").className="conn ok"; $("#conn span").textContent="Ao vivo";
    $("#errBanner").hidden=true;
    render();
  }catch(e){
    $("#conn").className="conn bad"; $("#conn span").textContent="Sem conexão";
    $("#errBanner").hidden=false; $("#errBanner").innerHTML="<span>"+esc(e.message)+"</span>";
  }finally{busy=false;}
}
async function setStatus(numero,status){
  const p=PED.find(x=>x.numero===numero); if(p) p.status=status; fresh.delete(numero); render();
  try{
    const r=await fetch("/api/pedidos",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({numero,status})});
    if(!r.ok) throw new Error();
  }catch(e){ load(); }
}

/* ---------- tela ---------- */
function mins(t){return Math.floor((Date.now()-t)/60000)}
function card(p){
  const m=mins(p.criadoEm), late=m>=LATE_MIN;
  return `<article class="order${fresh.has(p.numero)?" fresh":""}${late?" late":""}" data-n="${p.numero}">
    <div class="oh"><div class="num"><small>Pedido</small>${p.numero}</div>
      <div class="when"><b>${m<1?"agora":"há "+m+" min"}</b>${hhmm(p.criadoEm)} · ${esc(p.origem)}</div></div>
    <ul class="items">${p.itens.map(i=>`<li><span class="q">${i.q}×</span><span class="n">${esc(i.n)}</span><span class="p">${brl(i.p*i.q)}</span>${i.d?`<span class="d">${esc(i.d)}</span>`:""}</li>`).join("")}</ul>
    <div class="tot"><span>Total</span><span>${brl(p.total)}</span></div>
    <div class="acts"><button type="button" class="done" data-act="concluido">Concluído</button><button type="button" class="cancel" data-act="cancelado">Cancelar</button></div>
  </article>`;
}
function render(){
  const q=PED.filter(p=>p.status==="novo");
  const h=PED.filter(p=>p.status!=="novo").sort((a,b)=>b.numero-a.numero);
  $("#cntQ").textContent=q.length; $("#cntD").textContent=PED.length;
  $("#queue").innerHTML=q.length?q.map(card).join(""):`<div class="empty"><b>Nenhum pedido na fila</b>Os pedidos feitos no totem aparecem aqui na hora.</div>`;
  const vend=h.filter(p=>p.status==="concluido").reduce((a,p)=>a+p.total,0);
  $("#histSum").textContent=`${h.length} pedido${h.length===1?"":"s"} · ${brl(vend)} concluídos`;
  $("#histList").innerHTML=h.map(p=>`<div class="hrow"><span class="hn">${p.numero}</span><span class="ht">${hhmm(p.criadoEm)}</span><span class="hi">${esc(p.itens.map(i=>i.q+"× "+i.n).join(", "))}</span><span class="hv">${brl(p.total)}</span><span><span class="hs${p.status==="cancelado"?" c":""}">${p.status==="cancelado"?"Cancelado":"Concluído"}</span><button type="button" data-reopen="${p.numero}">Reabrir</button></span></div>`).join("");
  document.title=(q.length?`(${q.length}) `:"")+"Caixa | Pokentaro Ipanema";
}
$("#queue").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  setStatus(+b.closest(".order").dataset.n,b.dataset.act);
});
$("#histList").addEventListener("click",e=>{
  const b=e.target.closest("[data-reopen]"); if(b) setStatus(+b.dataset.reopen,"novo");
});
function tick(){$("#clock").textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"});}
tick(); setInterval(tick,10000);
setInterval(()=>{ if(PED.length) render(); },30000);
load(); setInterval(load,3000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
